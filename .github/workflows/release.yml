name: Release MyPassword

on:
  push:
    tags: ["*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: MyPassword-windows
          - os: macos-latest
            rid: osx-arm64
            artifact: MyPassword-macos-arm64
          - os: macos-26-intel
            rid: osx-x64
            artifact: MyPassword-macos-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: MyPassword-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish (Native AOT, self-contained)
        run: dotnet publish MyPasswordDesktop/MyPasswordDesktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish
      - name: Strip debug symbols (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: find publish -type f -name "*.pdb" -delete
      - name: Strip debug symbols (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem publish -Recurse -Filter *.pdb | Remove-Item -Force
      - name: Zip publish (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cd publish && zip -r ../${{ matrix.artifact }}.zip .
      - name: Zip publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: MyPassword ${{ github.ref_name }}
          files: "*.zip"
